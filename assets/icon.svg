<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-codex-sidebar 的图标：一条消息列表（三段两行的会话行）+ 右上角一颗铃铛。
    主题色与宿主侧栏的强调色同族（蓝紫），在浅色/深色底上都立得住。
  -->
  <defs>
    <linearGradient id="bg" x1="5" y1="4" x2="31" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E8CFF" />
      <stop offset="1" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="bell" x1="23" y1="8" x2="30" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#DCE4FF" />
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块 -->
  <rect x="5" y="5" width="26" height="26" rx="7.5" fill="url(#bg)" />

  <!-- 消息视图：三行，宽度递减，表示标题 + 预览的层级 -->
  <rect x="10" y="15.2" width="10.5" height="2.6" rx="1.3" fill="#FFFFFF" fill-opacity="0.95" />
  <rect x="10" y="20.4" width="13" height="2.6" rx="1.3" fill="#FFFFFF" fill-opacity="0.72" />
  <rect x="10" y="25.6" width="8" height="2.6" rx="1.3" fill="#FFFFFF" fill-opacity="0.5" />

  <!-- 铃铛：右上角的开关 -->
  <g stroke="#766BFF" stroke-width="1.5" stroke-linejoin="round">
    <path
      d="M26.4 9.2c-1.4 0-2.55 1.15-2.55 2.55v2.15c0 .3-.08.58-.24.82l-.95 1.45c-.17.26.02.6.33.6h6.82c.31 0 .5-.34.33-.6l-.95-1.45a1.4 1.4 0 0 1-.24-.82v-2.15c0-1.4-1.15-2.55-2.55-2.55z"
      fill="url(#bell)"
    />
    <circle cx="26.4" cy="17.6" r="1" fill="#DCE4FF" />
  </g>
</svg>
